<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meta</title>
  <link rel="stylesheet" href="../style.css">
  <script type="module" src="../global.js"></script>
  <script type="module" src="./main.js"></script>
</head>
<body>
  <h1>Meta</h1>
  <p>This page shows statistics about the code in my portfolio.</p>

  <div>
    <label>
      Show commits until:
      <input
        id="commit-progress"
        type="range"
        min="0"
        max="100"
        value="100"
      >
      <time id="commit-time"></time>
    </label>
  </div>
  <div id="stats"></div>

  <div id="scrolly-1">
    <div id="scatter-story">Some filler text here.</div>
    <div id="scatter-plot">

    <h2>Commits by time of day</h2>
    <div id="chart"></div>
    <p id="selection-count">No commits selected</p>
    <dl id="language-breakdown" class="stats"></dl>
    </div> 
  </div> 


    <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd><a href="" id="commit-link" target="_blank"></a></dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <dt>Time</dt>
    <dd id="tooltip-commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
      <dd id="commit-lines"></dd>
  </dl>
  <dl id="files"></dl>
</body>
</html>
